[project]
name = "emberwatch-ml"
version = "0.1.0"
description = "EmberWatch ML: data prep, training, evaluation and export"
# numpy 2.5 and jax 0.12 require Python >= 3.12. Local dev uses 3.12,
# Kaggle runs 3.13 (seen in the first Kaggle log, 2026-11-21).
requires-python = ">=3.12,<3.14"
# Latest releases as of 2026-11-21. Exact installed versions are recorded in
# every run's env.json.
dependencies = [
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pillow>=13.0.0",
    "huggingface_hub>=2.4.0",
]

[project.optional-dependencies]
# Scoring exported .onnx models only (no Keras/JAX): evaluation jobs.
eval = [
    "onnxruntime>=1.32.0",
]
# Model training and ONNX export (JAX backend, per docs/research/03).
train = [
    "keras==3.15.1",
    "keras-hub==0.33.0",
    "jax[cuda12]>=0.12.1",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "jax2onnx>=0.19.1",
]

[tool.uv]
# Code lives in ml/src and runs as modules from ml/:
#   uv run python -m src.data.pyro_sdis
# On Kaggle the same deps install with:
#   uv pip install -r pyproject.toml [--extra train]
package = false

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Run from ml/:  uv run pytest   (fast, no GPU, no datasets needed)
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
