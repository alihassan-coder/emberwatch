[project]
name = "emberwatch-api"
version = "0.2.0"
description = "EmberWatch API: serves the ONNX smoke model, camera ingestion, alerts, reviews and notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "sqlalchemy>=2.1.9",
]

[tool.uv]
# Code lives directly in src/ and runs from apps/api, like ml/:
#   uv run fastapi dev src/main.py
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Run from apps/api:  uv run pytest
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
