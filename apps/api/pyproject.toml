[project]
name = "emberwatch-api"
version = "0.2.0"
description = "EmberWatch API: serves the ONNX smoke model, camera ingestion, alerts, reviews and notifications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "sqlalchemy>=2.1.9",
]

[tool.uv]
# Code lives directly in src/ and runs from apps/api, like ml/:
#   uv run fastapi dev src/main.py
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Run from apps/api:  uv run pytest
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "F", "I", "B", "UP", "SIM"]
# (str, Enum) kept over StrEnum: str() of the members is part of stored/printed values today.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/File()/Query() in defaults is the framework's documented style.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]   # written by alembic autogenerate

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false
